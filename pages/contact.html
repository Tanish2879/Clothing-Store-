<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="../css/style.css">

</head>
<body>
    <header>
      <nav>
        <h2 class="logo">Clothing Store </h2>
        <div class="nav-links">
          <div class="nav-links">
              <a href="index.html">Home</a>
              <a href="products.html">Products</a>
              <a href="contact.html">Contact</a>
          </div>

          <button id="themeButton">
           Dark Mode
          </button>


          </div>
      </nav>

    </header>

    <main>

    <section class="contact">

        <div class="container contact-container">

            <div class="contact-info">

                <h1>Contact Info</h1>

                <p>
                    
                    Feel free to reach out to us with any questions or inquiries.
                    We are here to assist you and provide the best service possible.
                </p>

                <a href="mailto:clothing@ourstore.in"> 📧 mailto:clothing@ourstore.in </a>

                <a href="tel:+1234567890"> 📞 +1234567890 </a>

            </div>

            <div class="contact-form-section">

                <h1>Send Us a Message</h1>

                <form class="contact-form" onsubmit="/pages/404.html" method="get">

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">

                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Enter your message"></textarea>

                    <button type="submit">Send Message</button>

                </form>

            </div>

        </div>

    </section>

</main>
    <script src="../js/contact.js"></script>
</body>
</html>

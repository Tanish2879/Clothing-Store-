<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="../style.css">

</head>
<body>
    <header>
      <nav>
        <h2 class="logo">Clothing Store </h2>
          <div class="nav-links">
              <a href="home.html">Home</a>
              <a href="products.html">Products</a>
              <a href="contact.html">Contact</a>
          </div>
      </nav>

    </header>

    <main> 
        <section class="contact">
            <div class="container">
                <h1>Contact Us </h1>
                <form class="contact-form">
                    <label for="name">Name </label>
                    <input type ="text" id="name" placeholder="Enter you name">

                    <label for="email">Email</label>
                    <input type="email" id ="email" name="email" placeholder="Enter you email">

                    <label for="Phone number">Phone number</label>
                    <input type ="tel" id ="phone" name="phone" placeholder="Enter your Phone number">

                    <label for="Message">Message</label>
                    <textarea cols="30" rows="5" id="Message" name="message" placeholder="Enter your message"></textarea>

                    <button type="submit">Send Message</button>
                </form>
            </div>
        </section>
    </main>
    <script src="contact.js"></script>
</body>
</html>
